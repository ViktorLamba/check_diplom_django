name: ci

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: django_test
          POSTGRES_USER: django_user
          POSTGRES_PASSWORD: django_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U django_user -d django_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DB_NAME: django_test
      DB_USER: django_user
      DB_PASSWORD: django_pass
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint
        run: flake8 backend

      - name: Check migrations
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Run Django tests
        run: python backend/manage.py test apps.auth apps.registry

      - name: Build Sphinx docs
        run: |
          pip install -r docs/requirements.txt
          sphinx-build -b html docs/source docs/build/html

  build-and-push-images:
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'release')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select image tag by branch
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "IMAGE_TAG=prod" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAG=test" >> "$GITHUB_ENV"
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_REPO }}:backend-${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_REPO }}:frontend-${{ env.IMAGE_TAG }}

      - name: Build and push docs image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docs/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_REPO }}:docs-${{ env.IMAGE_TAG }}
